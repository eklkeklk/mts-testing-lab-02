name: Docker API tests

on: push

permissions:
  contents: read

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t api-test .
      - name: Run API test in container
        run: docker run --rm api-test
